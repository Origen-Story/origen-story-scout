# Example interests configuration
# Copy to interests.yaml and customize

topics:
  - name: "Technology & Innovation"
    keywords: ["AI", "robotics", "gadgets", "software", "innovation", "tech trends"]
    weight: 1.0
    
  - name: "Science & Environment"
    keywords: ["climate change", "biology", "space exploration", "physics", "sustainability"]
    weight: 1.0
  
  - name: "Business & Finance"
    keywords: ["economy", "stock market", "startups", "venture capital", "cryptocurrency"]
    weight: 0.9
  
  - name: "Culture & Society"
    keywords: ["media", "arts", "sociology", "social trends", "entertainment"]
    weight: 0.8

preferences:
  time_window_days: 10
  min_relevance_score: 0.3
  max_items_per_run: 20
  highlight_trending: true
  highlight_unique: true
