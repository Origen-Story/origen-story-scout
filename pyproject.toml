[project]
name = "origen-story-scout"
version = "0.1.0"
description = "An AI-powered content scout with provenance verification"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.2",
    "google-generativeai>=0.3.1",
    "anthropic>=0.8.1",
    "openai>=1.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "c2pa-python>=0.1.0",
    "pydantic>=2.5.2",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.111.0",
    "youtube-transcript-api>=0.6.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
